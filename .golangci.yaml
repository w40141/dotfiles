version: "2"
run:
  allow-parallel-runners: true
  timeout: 5m
linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - err113
    - errcheck
    - errorlint
    - exhaustive
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - gomoddirectives
    - gosec
    - govet
    - ineffassign
    - intrange
    - lll
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    funlen:
      lines: 80
      statements: 40
    gocognit:
      min-complexity: 20
    gocritic:
      disabled-checks:
        - hugeParam
      enabled-tags:
        - diagnostic
        - performance
        - style
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 100
    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: early-return
        - name: indent-error-flow
        - name: unexported-return
        - name: unused-parameter
        - name: var-declaration
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - err113
          - funlen
          - gocyclo
          - lll
    warn-unused: true
formatters:
  enable:
    - gofumpt
    - goimports
    - golines
  settings:
    gofumpt:
      module-path: example
    goimports:
      local-prefixes:
        - example
    golines:
      max-len: 100
      reformat-tags: true
      shorten-comments: true
      tab-len: 1
  exclusions:
    generated: strict
    warn-unused: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
severity:
  default: error
